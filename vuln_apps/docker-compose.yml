services:
    app:
        container_name: app
        build: ./docker/app
        ports:
            - "8080:8080"
        volumes:
            - ./src:/app
    mongo:
        container_name: mongo
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: prisma
        build: ./docker/mongo
        ports:
            - "27017:27017"
